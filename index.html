<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Untuk Sayang 🌸</title>

    <link rel="stylesheet"
        href="style.css">
</head>


<body>

    <!-- Sakura -->
    <div id="sakura-container"></div>


    <!-- Main -->
    <main class="container">

        <p class="small-text">
            A LITTLE SOMETHING FOR YOU
        </p>


        <h1>
            🌸 Happy Birthday Sayanggku🌸
        </h1>


        <p class="instruction">
            A little surprise for you, sayang. every time you click the dispense, a new message will appear. I hope you like it! 💖
        </p>


        <!-- =========================
             BIRTHDAY MACHINE
        ========================== -->

        <div class="machine"
            id="machine">


            <!-- Machine Header -->

            <div class="machine-top">

                <span>
                    ✦ BIRTHDAY ✦
                </span>

            </div>


            <!-- Glass -->

            <div class="glass">

                <div class="glass-shine"></div>


                <!-- Decorative Gumballs -->

                <div class="gumball ball-pink"></div>

                <div class="gumball ball-blue"></div>

                <div class="gumball ball-purple"></div>

                <div class="gumball ball-yellow"></div>

                <div class="gumball ball-green"></div>

                <div class="gumball ball-orange"></div>

                <div class="gumball ball-pink second"></div>

                <div class="gumball ball-blue second"></div>


            </div>


            <!-- Machine Bottom -->

            <div class="machine-body">


                <!-- Dispenser -->

                <div class="dispenser">

                    <div id="dispensedBall"></div>

                </div>


                <!-- Button -->

                <button
                    id="dispenseButton">

                    ✦ DISPENSE ✦

                </button>


            </div>

        </div>

    </main>


    <!-- =========================
         MESSAGE POPUP
    ========================== -->

    <div
        id="messageBox"
        class="message-box">


        <div class="message-content">


            <div class="flower">
                🌸
            </div>


            <p id="message">
            </p>


            <button
                id="closeMessage">

                ♡ close

            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
